<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Форма регистрации</title>
	<link rel="stylesheet" href="../styles/style.css">
</head>
<body>
	<main>
		<section>
			<h1>Регистрация</h1>
			<div>
				<span>Уже есть аккаунт?</span>
				<a href="#">Войти</a>
			</div>
			<form action="#">
				<div>
					<label for="login">Логин</label>
					<input type="text" id="login" name="login" placeholder="Введите логин" value="Моя компания">
				</div>
				<div>
					<label for="firstname">Имя</label>
					<input type="text" id="firstname" name="firstname" placeholder="Имя">
					<label for="surname">Фамилия</label>
					<input type="text" id="surname" name="surname" placeholder="Фамилия">
				</div>
				<div>
					<label for="email">E-mail</label>
					<input type="email" id="email" name="email" placeholder="E-mail">
				</div>
				<button type="submit">Зарегистрироваться</button>
				<div>
					<input class="agreement" type="checkbox" name="agreement" id="agreement"> <label for="agreement">Я прочитал и принимаю <a href="#">Условия использования</a></label>
				</div>
			</form>
		</section>
	</main>

</body>
</html>
